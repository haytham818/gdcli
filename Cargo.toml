[package]
name = "gdcli-cli"
version = "0.9.1"
edition = "2024"
description = "Drive a running Godot editor through its own APIs"
license = "MIT"
repository = "https://github.com/haytham818/gdcli"
homepage = "https://github.com/haytham818/gdcli"
readme = "README.md"
keywords = ["godot", "cli", "editor", "automation", "agent"]
categories = ["command-line-utilities", "game-development"]
exclude = [".github/**", "docs/**", "scripts/**", "tests/**"]

[[bin]]
name = "gdcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
