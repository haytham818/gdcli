<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Godot 4 编辑器深色背景渐变 -->
    <linearGradient id="editorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212631" />
      <stop offset="100%" stop-color="#13161C" />
    </linearGradient>

    <!-- Godot 官方蓝渐变 -->
    <linearGradient id="godotBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B9EE8" />
      <stop offset="100%" stop-color="#3B79B8" />
    </linearGradient>

    <!-- 终端面罩深色内衬 -->
    <linearGradient id="visorBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1015" />
      <stop offset="100%" stop-color="#171C24" />
    </linearGradient>

    <!-- 终端发光滤镜 -->
    <filter id="cliGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 外层圆角图标底板 -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#editorBg)" />
  <rect x="35" y="35" width="442" height="442" rx="101" fill="none" stroke="#333C4D" stroke-width="6" />

  <!-- Godot 齿轮机器人主体 (以 256, 272 为中心) -->
  <g transform="translate(256, 272)">
    <!-- 顶部与两侧 5 颗对称齿轮凸起 -->
    <rect x="-28" y="-192" width="56" height="64" rx="12" fill="url(#godotBlue)" />
    <rect x="-28" y="-192" width="56" height="64" rx="12" fill="url(#godotBlue)" transform="rotate(-42)" />
    <rect x="-28" y="-192" width="56" height="64" rx="12" fill="url(#godotBlue)" transform="rotate(42)" />
    <rect x="-28" y="-192" width="56" height="64" rx="12" fill="url(#godotBlue)" transform="rotate(-82)" />
    <rect x="-28" y="-192" width="56" height="64" rx="12" fill="url(#godotBlue)" transform="rotate(82)" />

    <!-- 机器人头部主轮廓 -->
    <path d="M -148 -28 
             C -148 -130, 148 -130, 148 -28 
             L 140 82 
             C 140 126, 96 146, 0 146 
             C -96 146, -140 126, -140 82 Z" fill="url(#godotBlue)" />

    <!-- 机器人面部 CLI 终端护目镜 -->
    <rect x="-116" y="-52" width="232" height="114" rx="28" fill="url(#visorBg)" stroke="#285582" stroke-width="5" />

    <!-- 左眼：命令行提示符 '>' -->
    <path d="M -78 -18 L -34 7 L -78 32" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#cliGlow)" />

    <!-- 右眼：Control 节点绿闪烁光标 '_' -->
    <rect x="20" y="18" width="62" height="18" rx="9" fill="#8EEF97" filter="url(#cliGlow)" />

    <!-- 下颌：Godot 经典机械分段口线 -->
    <path d="M -88 102 H -38 M -18 102 H 18 M 38 102 H 88" fill="none" stroke="#13161C" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>