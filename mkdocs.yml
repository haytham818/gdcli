site_name: gdcli
site_description: Drive a running Godot editor from the command line — no MCP, no .tscn patching.
site_url: https://haytham818.github.io/gdcli/
repo_url: https://github.com/haytham818/gdcli
repo_name: haytham818/gdcli
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
  - For agents: agents.md
  - Design: design.md
  - Protocol: protocol.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/haytham818/gdcli
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/gdcli-cli

copyright: MIT licensed
